[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seamflow"
version = "0.1.0"
description = "UV seam prediction for triangle meshes with rectified flow and an MMDiT backbone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
    "trimesh>=4.0",
    "safetensors",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.6"]
dev = ["pytest"]

[project.scripts]
seamflow-infer = "seamflow.cli:main"

[tool.setuptools]
packages = ["seamflow"]
